<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDIS Dubai · China–Arab Investment Ecosystem</title>
<meta name="description" content="GDIS Dubai connects China and the Arab world: investment & financing, company setup, market entry and digital ecosystem services from Business Bay, Dubai.">
<style>
:root{
  --bg:#05060b;--ink:#eef0f5;--sub:#9aa3b5;--gold:#e8b85c;--gold2:#f6d99a;
  --cn:#e0493a;--ar:#2fae8a;--glass:rgba(12,15,26,.55);--line:rgba(255,255,255,.12);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.no-webgl{background:radial-gradient(ellipse at 50% 40%,#3a2a10 0,#0b0d18 45%,var(--bg) 75%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:0;transition:opacity .5s;padding-top:0}
.lbl span{display:block;font-size:10.5px;letter-spacing:.08em;color:var(--sub);text-transform:none;margin-top:2px;text-align:center}
.lbl.cn{color:#ffb3a8}.lbl.ar{color:#9fe8cf}.lbl.hub{color:var(--gold2)}

/* nav */
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,48px);background:linear-gradient(to bottom,rgba(5,6,11,.8),rgba(5,6,11,0))}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--ink);text-decoration:none}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cf,var(--gold) 45%,#8a5a12 100%);box-shadow:0 0 18px rgba(232,184,92,.7)}
.logo small{font-weight:400;letter-spacing:.1em;color:var(--sub);font-size:11px}
.nav-r{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--sub);font:inherit;font-size:12.5px;padding:5px 11px;cursor:pointer}
.lang button.on{background:rgba(232,184,92,.16);color:var(--gold2)}
.cta{color:#1a1206;background:var(--gold);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}

/* progress dots */
.dots{position:fixed;right:clamp(10px,2vw,28px);top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:12px}
.dots a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);display:block;transition:all .3s}
.dots a.on{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.3)}
[dir=rtl] .dots{right:auto;left:clamp(10px,2vw,28px)}

/* sections */
main{position:relative;z-index:2}
section{min-height:100vh;display:flex;align-items:center;padding:110px clamp(16px,6vw,96px) 80px}
section.center{justify-content:center;text-align:center}
#s0{align-items:flex-start;padding-top:max(120px,16vh)}
section.right{justify-content:flex-end}
[dir=rtl] section.right{justify-content:flex-start}
.panel{max-width:520px;width:100%;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:30px 30px 26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
section.center .panel:not(.glass){background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:820px}
.kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
[dir=rtl] .kicker{letter-spacing:0}
h1,h2{text-shadow:0 2px 24px rgba(0,0,0,.65)}
h1{font-size:clamp(36px,6.4vw,78px);line-height:1.08;font-weight:700;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,#ff8a74,var(--gold2) 50%,#7fe3c2);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(26px,3.4vw,40px);line-height:1.2;margin-bottom:14px}
p.lead{font-size:clamp(15px,1.6vw,18px);color:#d6dbe6;margin-top:18px;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.hero-sub{max-width:620px;margin:22px auto 0}
.scroll-hint{margin-top:44px;font-size:12px;letter-spacing:.3em;color:var(--sub);text-transform:uppercase;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px);opacity:.6}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.two div{border:1px solid var(--line);border-radius:12px;padding:14px}
.two b{display:block;font-size:14px;margin-bottom:4px}
.two .c b{color:#ff9d8f}.two .a b{color:#86e0c1}
.two p{font-size:13.5px;color:var(--sub);line-height:1.6}
.svc{list-style:none;margin-top:18px;display:grid;gap:10px}
.svc li{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.svc li i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:8px;box-shadow:0 0 10px currentColor}
.svc b{display:block;font-size:15px}
.svc p{font-size:13.5px;color:var(--sub);line-height:1.6}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stats b{display:block;font-size:34px;color:var(--gold2);line-height:1.1}
.stats span{font-size:12.5px;color:var(--sub)}
.contact{margin-top:18px;display:grid;gap:8px;font-size:15px}
.contact a{color:var(--gold2);text-decoration:none}
.contact div{display:flex;gap:10px}
.contact span{color:var(--sub);min-width:64px}
footer{position:relative;z-index:2;text-align:center;padding:30px 16px 40px;color:var(--sub);font-size:12px}

@media (max-width:720px){
  header{padding:14px 16px}
  .logo small{display:none}
  .cta{display:none}
  section{padding:96px 16px 60px;align-items:flex-end}
  section.center{align-items:center}
  #s0{align-items:flex-start;padding-top:110px}
  .panel{padding:22px 18px;border-radius:14px}
  .two{grid-template-columns:1fr}
  .dots{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.scroll-hint{animation:none}}
</style>
</head>

import * as THREE from "./vendor/three.module.min.js";

const canvas=document.getElementById("scene");

catch(e){document.body.classList.add("no-webgl");canvas.remove();throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.toneMapping=THREE.ACESFilmicToneMapping;

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- procedural textures ---------- */
function rng(seed){return()=>((seed=Math.imul(seed^seed>>>15,seed|1)^(seed+Math.imul(seed^seed>>>7,seed|61)),((seed^seed>>>14)>>>0)/4294967296))}
function noiseTex(w,h,seed,palette,opts={}){
  const r=rng(seed),G=64,grid=[];for(let i=0;i<G*G;i++)grid.push(r());
  const sm=t=>t*t*(3-2*t);
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);
    const g=(a,b)=>grid[((a%G+G)%G)+((b%G+G)%G)*G];
    return (g(xi,yi)*(1-xf)+g(xi+1,yi)*xf)*(1-yf)+(g(xi,yi+1)*(1-xf)+g(xi+1,yi+1)*xf)*yf};
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const ctx=c.getContext("2d"),img=ctx.createImageData(w,h),cols=palette.map(p=>new THREE.Color(p));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    // wrap horizontally by sampling on a cylinder
    const a=x/w*Math.PI*2,R=4,px=Math.cos(a)*R+8,pz=Math.sin(a)*R+8,py=y/h*8*(opts.stretch||1);
    let v=0,amp=.5,f=1;for(let o=0;o<5;o++){v+=amp*vn(px*f+pz*f*.7,py*f+pz*f*.3);amp*=.5;f*=2.03}
    if(opts.bands)v=v*.55+.45*(.5+.5*Math.sin(y/h*Math.PI*opts.bands+v*6));
    v=Math.min(.999,Math.max(0,(v-.2)/.6));
    const i=v*(cols.length-1),k=Math.floor(i),t=i-k,c1=cols[k],c2=cols[Math.min(k+1,cols.length-1)];
    const o=(y*w+x)*4;
    let rr=c1.r+(c2.r-c1.r)*t,gg=c1.g+(c2.g-c1.g)*t,bb=c1.b+(c2.b-c1.b)*t;
    if(opts.lights&&v<.35&&r()<.012){rr=1;gg=.85;bb=.5}
    img.data[o]=rr*255;img.data[o+1]=gg*255;img.data[o+2]=bb*255;img.data[o+3]=255;
  }
  ctx.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;return tex;
}

/* ---------- starfield ---------- */

  const n=4000,pos=new Float32Array(n*3),col=new Float32Array(n*3),r=rng(7);
  for(let i=0;i<n;i++){
    const u=r()*2-1,th=r()*Math.PI*2,d=120+r()*200,s=Math.sqrt(1-u*u);
    pos.set([Math.cos(th)*s*d,u*d,Math.sin(th)*s*d],i*3);
    const w=.6+r()*.4,tint=r();col.set(tint<.1?[w,w*.8,w*.6]:tint<.2?[w*.75,w*.85,w]:[w,w,w],i*3);

/* ---------- glow sprite ---------- */
function glowTex(inner,outer){
  const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
  const g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,inner);g.addColorStop(.25,outer);g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g;x.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function glow(color,size,tex){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  s.scale.setScalar(size);return s;
}

/* ---------- the hub: Dubai / GDIS as the star ---------- */
const hub=new THREE.Group();scene.add(hub);
const sunMat=new THREE.ShaderMaterial({
  uniforms:{map:{value:noiseTex(512,256,11,["#7a3a06","#d8841c","#f6c35a","#fff1c8"])},time:{value:0}},
  vertexShader:`varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D map;uniform float time;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
  void main(){vec3 a=texture2D(map,vUv+vec2(time*.004,0.)).rgb;vec3 b=texture2D(map,vUv*1.7+vec2(-time*.006,time*.002)).rgb;
  vec3 c=mix(a,b,.45)*1.35;float f=pow(1.-max(dot(vN,vV),0.),2.);c+=vec3(1.,.75,.35)*f*.9;gl_FragColor=vec4(c,1.);}`
});
const sun=new THREE.Mesh(new THREE.SphereGeometry(1.8,64,64),sunMat);hub.add(sun);
const gTex=glowTex("rgba(255,236,190,1)","rgba(232,160,60,.35)");
hub.add(glow(0xffd28a,10,gTex));hub.add(glow(0xff9a3c,22,gTex));
const light=new THREE.PointLight(0xfff0d8,260,0,1.6);hub.add(light);
scene.add(new THREE.AmbientLight(0x334466,.35));

/* ---------- planets ---------- */
function planet(radius,palette,seed,atmo,opts){
  const g=new THREE.Group();
  const m=new THREE.Mesh(new THREE.SphereGeometry(radius,64,64),new THREE.MeshStandardMaterial({map:noiseTex(512,256,seed,palette,opts),roughness:.85,metalness:.05}));
  m.rotation.z=.35;const h=glow(atmo,radius*3.4,gTex);h.material.opacity=.55;g.add(h,m);g.userData.body=m;return g;
}
const system=new THREE.Group();scene.add(system);
const china=planet(1.25,["#3a0a0a","#7e1a14","#b8331f","#d9623a","#f2b66b"],21,0xff6a4a,{bands:0,lights:true});
const arab =planet(1.25,["#0a2a2a","#146b5a","#2fae8a","#d8c08a","#f3e2b8"],37,0x5fe0c0,{lights:true});
const ORB=8;china.position.set(-ORB,0,0);arab.position.set(ORB,0,0);
system.add(china,arab);
// orbit ring
{
  const pts=[];for(let i=0;i<=256;i++){const a=i/256*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*ORB,0,Math.sin(a)*ORB))}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xe8b85c,transparent:true,opacity:.18})));
}

/* ---------- the corridor: particles flowing both ways ---------- */
const FLOW=700;
const flowGeo=new THREE.BufferGeometry(),flowPos=new Float32Array(FLOW*3),flowCol=new Float32Array(FLOW*3),flowT=new Float32Array(FLOW),flowOff=[];
{
  const r=rng(99);
  for(let i=0;i<FLOW;i++){
    flowT[i]=r();flowOff.push(new THREE.Vector3((r()-.5)*.5,(r()-.5)*.5,(r()-.5)*.5));
    const dir=i%2,c=dir?new THREE.Color(0xff8a6a):new THREE.Color(0x7fe3c2);c.lerp(new THREE.Color(0xffe2a0),r()*.5);
    flowCol.set([c.r,c.g,c.b],i*3);
  }
  flowGeo.setAttribute("position",new THREE.BufferAttribute(flowPos,3));flowGeo.setAttribute("color",new THREE.BufferAttribute(flowCol,3));
}
const flowMat=new THREE.PointsMaterial({size:.13,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,map:glowTex("rgba(255,255,255,1)","rgba(255,255,255,.4)")});
scene.add(new THREE.Points(flowGeo,flowMat));
const curveA=new THREE.QuadraticBezierCurve3(new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3());
const curveB=new THREE.QuadraticBezierCurve3(new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3());

/* ---------- moons: services orbiting the hub ---------- */
const moonColors=[0xf6d99a,0x8fc7ff,0xff9d8f,0x86e0c1];
const moons=moonColors.map((c,i)=>{
  const pivot=new THREE.Group();pivot.rotation.x=.25+i*.18;pivot.rotation.z=(i-1.5)*.22;hub.add(pivot);
  const m=new THREE.Mesh(new THREE.SphereGeometry(.26,32,32),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.35,roughness:.6}));
  const R=3.1+i*.55;m.position.x=R;pivot.add(m);m.add(glow(c,1.4,gTex));
  const pts=[];for(let k=0;k<=128;k++){const a=k/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*R,0,Math.sin(a)*R))}
  const ring=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0}));
  pivot.add(ring);
  return {pivot,m,ring,speed:.22-i*.035,phase:i*1.7};
});

/* ---------- network: 200+ institutions as a galaxy shell ---------- */
const NET=220;
const netGeo=new THREE.BufferGeometry(),netPos=new Float32Array(NET*3);
{
  const r=rng(5);
  for(let i=0;i<NET;i++){
    const arm=i%3,t=r(),a=arm*2.094+t*4.2+(r()-.5)*.5,d=12+t*16+(r()-.5)*2.5;
    netPos.set([Math.cos(a)*d,(r()-.5)*2.2*(1-t*.5),Math.sin(a)*d],i*3);
  }
  netGeo.setAttribute("position",new THREE.BufferAttribute(netPos,3));
}
const netMat=new THREE.PointsMaterial({size:.9,color:0xffe0a6,transparent:true,opacity:.15,blending:THREE.AdditiveBlending,depthWrite:false,map:glowTex("rgba(255,255,255,1)","rgba(255,220,150,.35)")});
const net=new THREE.Points(netGeo,netMat);scene.add(net);
// connection lines hub → institutions
const linkGeo=new THREE.BufferGeometry(),linkPos=new Float32Array(NET*6);
for(let i=0;i<NET;i++){linkPos.set([0,0,0,netPos[i*3],netPos[i*3+1],netPos[i*3+2]],i*6)}
linkGeo.setAttribute("position",new THREE.BufferAttribute(linkPos,3));
const linkMat=new THREE.LineBasicMaterial({color:0xe8b85c,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.LineSegments(linkGeo,linkMat));

/* ---------- camera keyframes per section ---------- */
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const wp=o=>o.getWorldPosition(new THREE.Vector3());
const side=()=>document.documentElement.dir==="rtl"?-1:1; // panels swap sides in Arabic
const mob=()=>innerWidth<720;
const KEYS=[
  {look:()=>V(0,mob()?4.5:3.2,0),pos:()=>mob()?V(0,9,34):V(0,8,24)},              // hero: whole system, below the headline
  {look:()=>V(mob()?0:-4.5*side(),mob()?-3:.5,0),pos:()=>mob()?V(0,3,24):V(-3*side(),2.6,16)}, // mission: the corridor
  {look:()=>V(mob()?0:3.2*side(),mob()?3.5:0,0),pos:()=>mob()?V(0,6,14):V(2*side(),3.4,11)}, // services: moons
  {look:()=>V(mob()?0:-6*side(),mob()?-8:0,0),pos:()=>mob()?V(0,42,36):V(-4*side(),30,32)},  // network: galaxy
  {look:()=>V(0,5,0),         pos:()=>mob()?V(0,6,30):V(0,4,21)},                  // contact
];
const W=[ // per-section visibility weights: [labelsPlanets, moons, net]
  [1,0,0],[1,0,0],[0,1,0],[0,0,1],[.6,0,.25]
];

const sections=[...document.querySelectorAll("main section")];
const dots=[...document.querySelectorAll(".dots a")];
function progress(){
  const mid=innerHeight*.5;let p=0;
  for(let i=0;i<sections.length;i++){
    const r=sections[i].getBoundingClientRect();
    if(r.top<=mid){p=i+Math.min(1,(mid-r.top)/r.height)-.5}
  }
  return Math.max(0,Math.min(sections.length-1,p));
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- labels ---------- */
const L={hub:document.getElementById("l-hub"),cn:document.getElementById("l-cn"),ar:document.getElementById("l-ar"),m:[0,1,2,3].map(i=>document.getElementById("l-m"+i))};
const tmp=new THREE.Vector3();
function place(el,obj,dy,alpha){
  obj.getWorldPosition(tmp);tmp.y+=dy;tmp.project(camera);
  const vis=tmp.z<1&&Math.abs(tmp.x)<1.1&&Math.abs(tmp.y)<1.1;
  el.style.left=((tmp.x+1)/2*innerWidth)+"px";el.style.top=((1-tmp.y)/2*innerHeight)+"px";
  el.style.opacity=vis?alpha.toFixed(2):0;
}

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;
  camera.fov=innerWidth<720?60:45;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

const camPos=new THREE.Vector3(0,30,60),camLook=new THREE.Vector3(),clock=new THREE.Clock();
let t=0,prog=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05);t+=reduce?dt*.15:dt;
  prog+=(progress()-prog)*Math.min(1,dt*4);

  // motion
  system.rotation.y=t*.035;
  sun.rotation.y=t*.03;sunMat.uniforms.time.value=t;
  china.userData.body.rotation.y=t*.15;arab.userData.body.rotation.y=-t*.12;
  moons.forEach(o=>{o.pivot.rotation.y=o.phase+t*o.speed});
  net.rotation.y=t*.01;

  // corridor curves: arc over the hub, one above, one below
  const pc=wp(china),pa=wp(arab);
  curveA.v0.copy(pc);curveA.v2.copy(pa);curveA.v1.set(0,4.5,0);
  curveB.v0.copy(pa);curveB.v2.copy(pc);curveB.v1.set(0,-4.5,0);
  for(let i=0;i<FLOW;i++){
    const u=(flowT[i]+t*.06)%1,c=i%2?curveA:curveB;c.getPoint(u,tmp);tmp.addScaledVector(flowOff[i],Math.sin(u*Math.PI));
    flowPos[i*3]=tmp.x;flowPos[i*3+1]=tmp.y;flowPos[i*3+2]=tmp.z;
  }
  flowGeo.attributes.position.needsUpdate=true;

  // camera between keyframes
  const k=Math.floor(prog),f=ease(prog-k),a=KEYS[k],b=KEYS[Math.min(k+1,KEYS.length-1)];
  const tp=a.pos().lerp(b.pos(),f),tl=a.look().lerp(b.look(),f);
  camPos.lerp(tp,Math.min(1,dt*3));camLook.lerp(tl,Math.min(1,dt*3));
  camera.position.copy(camPos);camera.lookAt(camLook);

  // weights
  const wa=W[k],wb=W[Math.min(k+1,W.length-1)],w=wa.map((v,i)=>v+(wb[i]-v)*f);
  moons.forEach(o=>{o.ring.material.opacity=.05+w[1]*.35});
  netMat.opacity=.12+w[2]*.85;linkMat.opacity=w[2]*.035;
  flowMat.opacity=.35+w[0]*.6;

  place(L.hub,sun,2.6,Math.max(w[0],w[1])*Math.min(1,Math.max(0,prog-.4)*2));
  place(L.cn,china,1.9,w[0]);place(L.ar,arab,1.9,w[0]);
  moons.forEach((o,i)=>place(L.m[i],o.m,.55,w[1]));

  const cur=Math.round(prog);dots.forEach((d,i)=>d.classList.toggle("on",i===cur));
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
